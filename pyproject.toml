[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcapi-mcp"
version = "0.1.0"
description = "MCP server for TransCAPI: live bus and rail departures, vehicles, disruptions and journey planning for Great Britain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.2,<3", "httpx>=0.27"]
keywords = ["mcp", "transport", "bus", "rail", "uk", "great britain", "transcapi"]

[project.urls]
Homepage = "https://www.transcapi.com"
Documentation = "https://www.transcapi.com/docs"
Repository = "https://github.com/tcdataconsultants/transcapi-mcp"

[project.scripts]
transcapi-mcp = "transcapi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transcapi_mcp"]
